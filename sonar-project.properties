# 테스트·빌드 결과·타입선언 제외
# ⚠️ sonar.cpd.exclusions: Automatic Analysis에서 완전 무효
# ⚠️ sonar.exclusions 와일드카드: PR 신규 코드 CPD 분석에서도 동작하지 않음 — 실제 중복 제거 필요
# ⚠️ sonar.coverage.exclusions: PR 신규 코드 커버리지 분석에서도 동작하지 않음 — sonar.exclusions에 추가 필요
# consumer.ts: BaseConsumer(xzawedShared/src)와 패턴 중복 가능성 — CPD 오탐 방지
# 서비스 진입점 index.ts: process 부트스트랩 코드, 단위 테스트 불가
# Designer/Planner config.ts: 포트 번호만 다른 구조적으로 동일한 파일 — CPD 오탐 방지
# xzawedManager/packages/server/src/types/**: 타입 전용 파일 — 런타임 코드 없음
# refresh.repo.ts: PostgreSQL 어댑터 — createHash('sha256') S4787 hotspot, sonar.exclusions으로만 완전 억제 가능
# app/src/renderer/src/**: Electron 렌더러 전체 — browser 테스트(vitest) 및 E2E(Playwright)로 검증, node lcov 커버리지 미포함. PR 신규 코드 분석에서 coverage.exclusions 무효이므로 sonar.exclusions 와일드카드로 일괄 제외
# app/src/main/**: Electron main 프로세스 — IPC·OAuth·MCP 인프라, 통합 테스트 불가
# app/src/preload/**: Electron preload — contextBridge 래퍼, 단위 테스트 불가
# Manager·Orchestrator config.ts: 두 서비스의 resolveProfileEnv 는 PAIS_PROFILE 병합 의미론이라
#   동일해야만 프로필이 프로필로서 동작한다. 두 서비스는 공유 라이브러리를 갖지 않고
#   (Orchestrator Dockerfile 이 xzawedShared 를 복사조차 하지 않는다) 복제가 유일한 선택이다.
#   중복 감시는 SonarCloud 대신 jscpd(블록 마커) + scripts/check-replicated-blocks.js 가 맡는다
#   — 후자는 두 사본이 갈라지면 파일:줄로 지목하고 실패한다. server.ts 가 이미 같은 이유로 여기 있다.
# shutdown.ts 2개(+테스트 2개): 종료 코어(가드·워치독·step 헬퍼)가 같은 이유로 복제다 —
#   서비스 간 import 금지(M3)에 Orchestrator 는 @xzawed/agent-streams 를 의존조차 하지 않는다.
#   jscpd 는 replicated-block 마커로 0 clones 이지만 **그 마커는 SonarCloud 에 아무 효과가 없다**
#   (별개 도구다). 테스트 2개도 함께 넣는 이유는 위 ⚠️ 대로 `**/*.test.ts` 와일드카드가
#   PR 신규 코드 CPD 에서 동작하지 않기 때문이다 — 명시 경로만 듣는다.
#   대가: 이 4개 파일은 CPD 뿐 아니라 버그·스멜 분석에서도 빠진다. 동일성 감시는
#   scripts/check-replicated-blocks.js(shutdown-core) 가 대신 맡는다.
# readiness.ts 2개: 실검사 헬스체크 코어(프로브 실행·타임아웃·판정)가 같은 이유로 복제다 —
#   Orchestrator 만 @xzawed/agent-streams 를 의존하지 않는다(소비처 8곳 중 유일). 마커 구간이
#   132줄이라 Sonar cpd.minimumTokens=100 을 확실히 넘고, 두 파일 모두 신규라 PR 신규 코드
#   중복률이 그대로 게이트를 친다. jscpd 는 replicated-block 마커로 0 clones 지만 그 마커는
#   SonarCloud 에 아무 효과가 없다(별개 도구).
#   대가: 두 파일이 버그·스멜 분석에서도 빠진다. 동일성은 check-replicated-blocks.js(readiness-core),
#   판정 의미론은 xzawedShared/src/__tests__/readiness.test.ts 23건이 대신 지킨다.
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/dist/**,**/build/**,**/.turbo/**,**/*.d.ts,**/node_modules/**,xzawedOrchestrator/packages/server/src/streams/consumer.ts,**/pnpm-lock.yaml,**/package-lock.json,xzawedLauncher/**,xzawedOrchestrator/packages/server/src/projects/workspace.service.ts,xzawedDesigner/src/index.ts,xzawedDeveloper/src/index.ts,xzawedPlanner/src/index.ts,xzawedTester/src/index.ts,xzawedBuilder/src/index.ts,xzawedSecurity/src/index.ts,xzawedWatcher/src/index.ts,xzawedManager/packages/server/src/types/**,xzawedOrchestrator/packages/server/src/auth/refresh.repo.ts,xzawedOrchestrator/packages/app/src/renderer/src/**,xzawedOrchestrator/packages/app/src/main/**,xzawedOrchestrator/packages/app/src/preload/**,xzawedOrchestrator/packages/server/src/sessions/pg-session.store.ts,xzawedOrchestrator/packages/server/src/streams/redis.client.ts,xzawedManager/packages/server/src/server.ts,xzawedManager/packages/server/src/streams/redis.client.ts,xzawedDesigner/src/config.ts,xzawedPlanner/src/config.ts,xzawedManager/packages/server/src/config.ts,xzawedOrchestrator/packages/server/src/config.ts,xzawedOrchestrator/packages/server/src/shutdown.ts,xzawedManager/packages/server/src/shutdown.ts,xzawedOrchestrator/packages/server/src/__tests__/shutdown.test.ts,xzawedManager/packages/server/src/__tests__/shutdown.test.ts,xzawedShared/src/health/readiness.ts,xzawedOrchestrator/packages/server/src/health/readiness.ts
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**
sonar.cpd.minimumTokens=100

# 커버리지 제외 대상:
# 1. Electron renderer/preload/main — browser 테스트 또는 E2E로 검증 (sonar.exclusions에도 포함)
# 2. 서비스 진입점(index.ts) — process.main 호출만 하므로 단위 테스트 불가
# 3. Fastify HTTP 서버 설정(server.ts) — 독립 서비스의 /health 라우트 전용, 단위 테스트 불가
# 4. DB 연결 인프라 및 타입 정의 — 런타임 의존성, 단위 테스트 불가
# 5. Orchestrator PostgreSQL 어댑터 — 실제 DB 없이 단위 테스트 불가
sonar.coverage.exclusions=xzawedOrchestrator/packages/app/src/renderer/src/**,xzawedOrchestrator/packages/app/src/preload/**,xzawedOrchestrator/packages/app/src/main/**,xzawedOrchestrator/packages/ui/src/components/**,**/src/index.ts,xzawedOrchestrator/packages/server/src/mcp/entry.ts,xzawedOrchestrator/packages/server/src/db/**,xzawedOrchestrator/packages/server/src/sessions/pg-session.store.ts,xzawedOrchestrator/packages/server/src/sessions/message.repo.ts,xzawedOrchestrator/packages/server/src/auth/user.repo.ts,xzawedOrchestrator/packages/server/src/auth/refresh.repo.ts,xzawedOrchestrator/packages/server/src/github-tokens/github-token.repo.ts,xzawedOrchestrator/packages/server/src/streams/redis.client.ts,xzawedOrchestrator/packages/server/src/manager/manager.client.ts,xzawedOrchestrator/packages/server/src/ws/session.ws.ts,xzawedOrchestrator/packages/server/src/claude/ssh-remote-runner.ts,xzawedOrchestrator/packages/server/src/claude/api-runner.ts,xzawedOrchestrator/packages/server/src/claude/intent-structurer.ts,xzawedManager/packages/server/src/server.ts,xzawedManager/packages/server/src/db/**,xzawedManager/packages/server/src/types/**,xzawedManager/packages/server/src/streams/redis.client.ts,xzawedDesigner/src/server.ts,xzawedDeveloper/src/server.ts,xzawedSecurity/src/server.ts,xzawedTester/src/server.ts,xzawedWatcher/src/server.ts

