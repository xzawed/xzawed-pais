# docker-compose.prod.yml — GHCR 사전 빌드 이미지 기반 (비개발자 배포용)
#
# 이 스택은 **사용자 PC에서 Launcher 가 띄우는 로컬 스택**이다(서버 배포용 compose 는 저장소에 없다).
# 그래서 태세의 기준선은 "인증을 걸었는가"가 아니라 **"이 기계 밖에서 닿는가"**다.
#
#   - 호스트 포트를 여는 앱 서비스는 orchestrator 하나뿐이고, 그것도 **루프백에만** 묶는다.
#     "3000:3000" 표기는 0.0.0.0 바인딩이라 같은 LAN 의 아무나 무인증 오케스트레이터에 닿았다.
#     나머지 8개는 compose 네트워크 안에서 서비스명으로만 통신한다.
#   - API 키는 env 가 아니라 compose secret 으로 넣는다. env 로 넣으면 docker inspect 의
#     Config.Env 에 평문으로 남는다. secret 소스는 environment: 라 Launcher 가 이미 하고 있는
#     env 전달을 그대로 쓴다 — file: 로 하면 복호화한 키를 디스크에 평문으로 써야 해서 후퇴다.
#   - 앱 서비스 9종 모두 healthcheck 를 갖는다. restart: unless-stopped 만 있으면 크래시 루프가
#     "up" 으로 보이고, Launcher 의 상태 표시가 docker compose ps 라 더욱 그렇다.
#
# **ANTHROPIC_API_KEY 는 필수다.** 미설정이든 빈 문자열이든 `docker compose` 가 즉시 거부한다.
# 키를 요구하는 서비스는 **8개**다 — 에이전트 6종과 Manager 는 무조건(`z.string().min(1)`),
# orchestrator 는 `CLAUDE_MODE=api` 일 때이고 이 파일의 기본값이 `api` 라 실질 무조건이다.
#
# ⚠️ **미설정과 빈 문자열은 compose 에서 다르게 다뤄진다** — 아래 `x-require-anthropic-api-key` 가
#    있는 이유다. `secrets.*.environment` 는 **미설정만** 거부한다. 빈 문자열이면 compose 가
#    그냥 뜨고 `/run/secrets/anthropic_api_key` 파일이 **아예 생기지 않아서**, 각 서비스가
#    `ANTHROPIC_API_KEY_FILE` 을 읽다 throw 하고 `restart: unless-stopped` 가 그것을 되살린다 —
#    이 주석이 막겠다고 적어 둔 바로 그 크래시 루프다. `${VAR:?}` 는 둘 다 거부한다(실측 확인).
#    값은 서비스에 붙지 않는 최상위 확장 필드에만 두므로 컨테이너 env·`docker inspect` 에 남지 않는다.
x-require-anthropic-api-key: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY 가 비어 있거나 없다. Launcher 로 띄우거나 셸/.env 에 실제 키를 설정하라}

name: xzawed-pais

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xzawed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: xzawed_orchestrator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xzawed"]
      interval: 5s
      timeout: 3s
      retries: 5
    # 앱 9곳은 상한이 있는데 인프라 2곳만 무제한이었다 — 한 컨테이너가 호스트를 먹으면
    # 나머지 10개가 같이 죽는다. 이 값들은 **튜닝값이 아니라 호스트 고갈을 막는 천장**이다.
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # **상한만 걸면 더 나빠진다.** `maxmemory` 가 없으면 Redis 는 계속 자라다 Docker 에게
    # OOM-kill 당하고, 그건 재시작 루프 + 미전달 메시지 유실이다. 컨테이너 천장보다 **낮은**
    # `maxmemory` 를 줘서 Redis 자신의 정책이 먼저 발동하게 한다(384m < 512m).
    #
    # **정책은 `noeviction` 이다 — 이 Redis 는 캐시가 아니라 메시지 버스다.** `allkeys-lru` 는
    # 아직 소비되지 않은 스트림 엔트리를 **조용히 지운다**(무음 유실). `noeviction` 은 대신
    # 쓰기를 에러로 실패시키고, 생산자는 그것을 표면화한다 — 시끄러운 실패가 조용한 유실보다 낫다.
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  orchestrator:
    image: ghcr.io/xzawed/xzawed-orchestrator:latest
    ports: ["127.0.0.1:3000:3000"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://xzawed:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/xzawed_orchestrator
      PORT: "3000"
      MODE: local
      MANAGER_URL: http://manager:3001
      CLAUDE_MODE: ${CLAUDE_MODE:-cli}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  manager:
    image: ghcr.io/xzawed/xzawed-manager:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  planner:
    image: ghcr.io/xzawed/xzawed-planner:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3002"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  developer:
    image: ghcr.io/xzawed/xzawed-developer:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3003"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    volumes: [workspace:/workspace]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  designer:
    image: ghcr.io/xzawed/xzawed-designer:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3004"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  tester:
    image: ghcr.io/xzawed/xzawed-tester:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3005"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    volumes: [workspace:/workspace]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  builder:
    image: ghcr.io/xzawed/xzawed-builder:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3006"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    volumes: [workspace:/workspace]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  watcher:
    image: ghcr.io/xzawed/xzawed-watcher:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3007"
      WORKSPACE_ROOT: /workspace
    volumes: [workspace:/workspace]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  security:
    image: ghcr.io/xzawed/xzawed-security:latest
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3008"
      WORKSPACE_ROOT: /workspace
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
    volumes: [workspace:/workspace:ro]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

secrets:
  # 소스가 compose 프로세스의 env 다. Launcher 는 safeStorage 로 복호화한 키를
  # docker compose 의 env 로 넘기고, compose 가 그것을 컨테이너 안 tmpfs 파일로 만든다.
  # 프로젝트 `.env` 도 이 소스로 쓰인다(실측 확인).
  #
  # **여기서 거부하는 것은 미설정뿐이다.** 빈 문자열은 통과하고 secret 파일이 안 생긴다 —
  # 그것까지 막는 것은 파일 상단의 `x-require-anthropic-api-key` 다. 둘은 한 쌍이라
  # 하나를 지우면 빈 키가 다시 크래시 루프로 새어 나간다.
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY

volumes:
  redis-data:
  postgres-data:
  workspace:
