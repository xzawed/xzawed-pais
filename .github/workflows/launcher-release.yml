name: Launcher Release

on:
  push:
    tags: ['launcher-v*']
  # **태그 없이도 패키징을 돌릴 수 있어야 한다.** 이것이 없으면 windows·macos·linux
  # 산출물이 **릴리스를 자른 뒤에야** 처음 검증된다 — 필수 PR 잡(`ci.yml` 의 `launcher`)은
  # `ELECTRON_SKIP_BINARY_DOWNLOAD: "1"` 이라 electron 바이너리를 받지도 않고
  # `electron-builder` 를 부르지도 않으므로, 그 초록은 tsc + vitest 만 말한다.
  # 실제로 그 사각지대에서 결함이 나왔다(설정 파일이 자동 탐색되지 않는 이름이라
  # 통째로 무시돼 출하본에 compose 파일이 없었다 — 로컬 패키징으로만 발견됐다).
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # 루트에 lockfile 이 없다 — 경로를 주지 않으면 setup-node 가 저장소 루트에서 찾다 실패한다.
          cache-dependency-path: xzawedLauncher/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: xzawedLauncher
        run: pnpm install --frozen-lockfile
      - name: Build shared
        working-directory: xzawedLauncher/packages/shared
        run: pnpm build
      - name: Test
        working-directory: xzawedLauncher/packages/app
        run: pnpm test
      - name: Build app
        working-directory: xzawedLauncher/packages/app
        run: pnpm build
      - name: Package app
        working-directory: xzawedLauncher/packages/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-windows
          path: |
            xzawedLauncher/packages/app/dist/*.exe
            xzawedLauncher/packages/app/dist/latest.yml

  build-macos:
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # 루트에 lockfile 이 없다 — 경로를 주지 않으면 setup-node 가 저장소 루트에서 찾다 실패한다.
          cache-dependency-path: xzawedLauncher/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: xzawedLauncher
        run: pnpm install --frozen-lockfile
      - name: Build shared
        working-directory: xzawedLauncher/packages/shared
        run: pnpm build
      - name: Test
        working-directory: xzawedLauncher/packages/app
        run: pnpm test
      - name: Build app
        working-directory: xzawedLauncher/packages/app
        run: pnpm build
      - name: Package app
        working-directory: xzawedLauncher/packages/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-macos
          path: |
            xzawedLauncher/packages/app/dist/*.dmg
            xzawedLauncher/packages/app/dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # 루트에 lockfile 이 없다 — 경로를 주지 않으면 setup-node 가 저장소 루트에서 찾다 실패한다.
          cache-dependency-path: xzawedLauncher/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: xzawedLauncher
        run: pnpm install --frozen-lockfile
      - name: Build shared
        working-directory: xzawedLauncher/packages/shared
        run: pnpm build
      - name: Test
        working-directory: xzawedLauncher/packages/app
        run: pnpm test
      - name: Build app
        working-directory: xzawedLauncher/packages/app
        run: pnpm build
      - name: Package app
        working-directory: xzawedLauncher/packages/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-linux
          path: |
            xzawedLauncher/packages/app/dist/*.AppImage
            xzawedLauncher/packages/app/dist/*.deb
            xzawedLauncher/packages/app/dist/latest-linux.yml

  release:
    # **릴리스는 태그 푸시에서만 만든다.** `workflow_dispatch` 는 3플랫폼 패키징을 실제로
    # 돌려 산출물만 남기는 검증 실행이라, 여기서 릴리스를 만들면 검증할 때마다 릴리스가
    # 생긴다. 세 build 잡의 `upload-artifact` 는 그대로 도므로 산출물은 확인할 수 있다.
    if: github.event_name == 'push'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
