name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Turborepo services ─────────────────────────────────────────────────────
  turborepo:
    name: "${{ matrix.service }} (Turborepo)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: xzawedOrchestrator
            dir: xzawedOrchestrator
          - service: xzawedManager
            dir: xzawedManager
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      - name: Build xzawedShared
        if: matrix.service == 'xzawedManager'
        working-directory: xzawedShared
        run: pnpm install && pnpm build

      - name: Install
        working-directory: ${{ matrix.dir }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}
        run: pnpm --filter @xzawed/app exec playwright install --with-deps chromium

      - name: Build
        working-directory: ${{ matrix.dir }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm build

      - name: Build web app
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}
        run: pnpm --filter @xzawed/web build

      - name: Test + coverage server (shard 1/2)
        working-directory: ${{ matrix.dir }}/packages/server
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm vitest run --coverage --coverage.reportsDirectory=coverage/shard-1 --shard=1/2

      - name: Test + coverage server (shard 2/2)
        working-directory: ${{ matrix.dir }}/packages/server
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm vitest run --coverage --coverage.reportsDirectory=coverage/shard-2 --shard=2/2

      - name: Merge server coverage
        working-directory: ${{ matrix.dir }}/packages/server
        run: |
          mkdir -p coverage
          cat coverage/shard-*/lcov.info > coverage/lcov.info

      - name: Test app
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}/packages/app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          NODE_OPTIONS: --max-old-space-size=2048
        run: pnpm vitest run --reporter=dot

      - name: Test ui
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}/packages/ui
        run: pnpm vitest run --reporter=dot

      - name: Generate ui coverage
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}/packages/ui
        run: pnpm test:coverage

      - name: Generate app coverage
        if: matrix.service == 'xzawedOrchestrator'
        working-directory: ${{ matrix.dir }}/packages/app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.dir }}/packages/*/coverage/lcov.info
          if-no-files-found: warn

      - name: Audit
        working-directory: ${{ matrix.dir }}
        run: pnpm audit --audit-level=moderate

  # ── Independent services ───────────────────────────────────────────────────
  independent:
    name: "${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [shared-lib]
    strategy:
      fail-fast: false
      matrix:
        service:
          - xzawedPlanner
          - xzawedDeveloper
          - xzawedDesigner
          - xzawedTester
          - xzawedBuilder
          - xzawedWatcher
          - xzawedSecurity

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml

      - name: Download xzawedShared dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xzawedShared-dist
          path: xzawedShared/dist/

      - name: Install
        working-directory: ${{ matrix.service }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ matrix.service }}
        run: pnpm build

      - name: Test
        working-directory: ${{ matrix.service }}
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: warn

      - name: Audit
        working-directory: ${{ matrix.service }}
        run: pnpm audit --audit-level=moderate

  # ── Launcher (Electron) ────────────────────────────────────────────────────
  launcher:
    name: xzawedLauncher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xzawedLauncher/pnpm-lock.yaml

      - name: Install
        working-directory: xzawedLauncher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: xzawedLauncher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm build

      - name: Type Check
        working-directory: xzawedLauncher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm typecheck

      - name: Test
        working-directory: xzawedLauncher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm test

      - name: Audit
        working-directory: xzawedLauncher
        run: pnpm audit --audit-level=moderate

  # ── xzawedShared ──────────────────────────────────────────────────────────
  shared-lib:
    name: xzawedShared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xzawedShared/pnpm-lock.yaml

      - name: Install
        working-directory: xzawedShared
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: xzawedShared
        run: pnpm build

      - name: Test
        working-directory: xzawedShared
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xzawedShared
          path: xzawedShared/coverage/lcov.info
          if-no-files-found: warn

      - name: Audit
        working-directory: xzawedShared
        run: pnpm audit --audit-level=moderate

      - name: Upload xzawedShared dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xzawedShared-dist
          path: xzawedShared/dist/
          if-no-files-found: error
          retention-days: 1

  # ── Redis Streams Integration Tests ───────────────────────────────────────
  redis-integration:
    name: Redis Streams Integration Tests
    runs-on: ubuntu-latest
    needs: [turborepo, independent]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xzawedOrchestrator/pnpm-lock.yaml

      - name: Install
        working-directory: xzawedOrchestrator
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: xzawedOrchestrator
        run: pnpm build

      - name: Run Redis Integration Tests
        working-directory: xzawedOrchestrator/packages/server
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm test -- --reporter=verbose src/__tests__/redis-streams.integration.test.ts

  # ── Manager Redis wiring E2E (G9 Slice C) ─────────────────────────────────
  # 프리미엄(autonomous) 프로필이 켜는 실 소비자 루프가 build→WP→verify→완료 아크를 실제로 닫는지
  # 실 Redis+PG로 증명(Slice A는 소비자 우회라 배선 미증명). Manager turborepo 잡은 redis가 없어
  # premium-profile-wiring.integration.test.ts를 REDIS_URL 부재로 skip → 이 전용 잡에서만 실행.
  manager-redis-integration:
    name: Manager Redis Wiring Integration
    runs-on: ubuntu-latest
    needs: [turborepo]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xzawedManager/pnpm-lock.yaml

      - name: Build xzawedShared
        working-directory: xzawedShared
        run: pnpm install && pnpm build

      - name: Install
        working-directory: xzawedManager
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: xzawedManager
        run: pnpm build

      - name: Run Manager Redis wiring E2E
        working-directory: xzawedManager/packages/server
        run: pnpm vitest run test/premium-profile-wiring.integration.test.ts

  # ── Playwright E2E (Electron) ─────────────────────────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [turborepo]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: xzawedOrchestrator/pnpm-lock.yaml

      - name: Install (with Electron binary)
        working-directory: xzawedOrchestrator
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: xzawedOrchestrator/packages/app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm build

      - name: Install Playwright system deps
        working-directory: xzawedOrchestrator/packages/app
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        working-directory: xzawedOrchestrator/packages/app
        run: xvfb-run --server-args="-screen 0 1280x800x24" pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: xzawedOrchestrator/packages/app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Copy-Paste Detection (PR only) ────────────────────────────────────────
  cpd:
    name: Copy-Paste Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jscpd
        run: npm install --ignore-scripts --no-fund --no-audit jscpd@3.5.10

      - name: Run jscpd
        id: jscpd
        run: |
          mkdir -p cpd-report
          # 실패를 삼키지 않는다 — .jscpd.json 의 threshold:0 은 클론이 하나라도 있으면 non-zero 다.
          # 이전에는 이 명령 끝에 무조건 성공시키는 접미사가 붙어 있어 CPD 게이트가 항상 초록이었다.
          # 이 워크플로에서 실패 삼킴 접미사는 0건이어야 한다(grep 으로 확인 가능).
          ./node_modules/.bin/jscpd --config .jscpd.json --reporters json,markdown --output ./cpd-report

      - name: Post CPD report as PR comment
        if: always()   # 클론 검출로 위 스텝이 실패해도 리포트는 남긴다
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            let body = '## Copy-Paste Detection Report\n\n'

            const mdPath = path.join('cpd-report', 'jscpd-report.md')
            if (fs.existsSync(mdPath)) {
              const md = fs.readFileSync(mdPath, 'utf8')
              body += md.trim() === '' ? '✅ No duplications found.' : md
            } else {
              body += '✅ No duplications found.'
            }

            body += '\n\n---\n_Generated by [jscpd](https://github.com/kucherenko/jscpd) · minTokens: 100_'

            const marker = '<!-- jscpd-report -->'
            body = marker + '\n' + body

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  # ── SonarCloud CPD API report (PR only) ───────────────────────────────────
  sonar-cpd-report:
    name: SonarCloud CPD Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Wait for SonarCloud analysis
        id: sonar-wait
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_KEY="xzawed_xzawed-pais"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MAX_WAIT=300
          ELAPSED=0

          echo "Waiting for SonarCloud analysis on PR #${PR_NUMBER}..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            curl -sf -u "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/ce/activity?component=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&ps=1" \
              -o /tmp/sonar-status.json 2>/dev/null || echo '{"tasks":[]}' > /tmp/sonar-status.json
            STATUS=$(python3 -c "import json; d=json.load(open('/tmp/sonar-status.json')); t=d.get('tasks',[]); print(t[0]['status'] if t else 'NONE')")
            echo "  Status: ${STATUS} (${ELAPSED}s elapsed)"
            if [ "${STATUS}" = "SUCCESS" ] || [ "${STATUS}" = "FAILED" ] || [ "${STATUS}" = "CANCELED" ]; then
              echo "sonar_status=${STATUS}" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 20
            ELAPSED=$((ELAPSED + 20))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "sonar_status=TIMEOUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch CPD breakdown from SonarCloud API
        id: sonar-cpd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_KEY="xzawed_xzawed-pais"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          python3 - <<'PYEOF'
          import os, sys, json, urllib.request, urllib.error

          token = os.environ["SONAR_TOKEN"]
          project = "xzawed_xzawed-pais"
          pr = os.environ.get("PR_NUMBER", "")

          def api(path):
              req = urllib.request.Request(
                  f"https://sonarcloud.io/api/{path}",
                  headers={"Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          PR_NUMBER = "${{ github.event.pull_request.number }}"

          # Quality gate status
          try:
              gate = api(f"qualitygates/project_status?projectKey={project}&pullRequest={PR_NUMBER}")
              gate_status = gate["projectStatus"]["status"]
          except Exception as e:
              gate_status = f"ERROR({e})"

          # File-level CPD metrics
          try:
              tree = api(
                  f"measures/component_tree?component={project}&pullRequest={PR_NUMBER}"
                  f"&metricKeys=new_duplicated_lines,duplicated_lines_density"
                  f"&strategy=leaves&s=metric&metricSort=new_duplicated_lines&asc=false&ps=20"
              )
              components = tree.get("components", [])
          except Exception as e:
              components = []
              print(f"Warning: {e}", file=sys.stderr)

          lines = [f"gate={gate_status}"]
          rows = []
          for c in components:
              name = c.get("name", c.get("key", "?"))
              path = c.get("path", "")
              metrics = {m["metric"]: m.get("value", m.get("period", {}).get("value", "0")) for m in c.get("measures", [])}
              new_dup = metrics.get("new_duplicated_lines", "0")
              density = metrics.get("duplicated_lines_density", "0")
              if float(new_dup or 0) > 0 or float(density or 0) > 3.0:
                  rows.append(f"{path or name}|{new_dup}|{density}%")

          if rows:
              lines.append("has_issues=true")
              lines.append("rows=" + ";;".join(rows))
          else:
              lines.append("has_issues=false")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Post SonarCloud CPD comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE: ${{ steps.sonar-cpd.outputs.gate }}
          HAS_ISSUES: ${{ steps.sonar-cpd.outputs.has_issues }}
          ROWS: ${{ steps.sonar-cpd.outputs.rows }}
          SONAR_STATUS: ${{ steps.sonar-wait.outputs.sonar_status }}
        with:
          script: |
            const marker = '<!-- sonar-cpd-report -->'
            const gate = process.env.GATE || 'UNKNOWN'
            const hasIssues = process.env.HAS_ISSUES === 'true'
            const sonarStatus = process.env.SONAR_STATUS || 'UNKNOWN'

            let body = marker + '\n## SonarCloud CPD Analysis\n\n'

            if (sonarStatus === 'TIMEOUT') {
              body += '⏳ SonarCloud analysis did not complete within 5 minutes. Check the [dashboard](https://sonarcloud.io/project/overview?id=xzawed_xzawed-pais) manually.\n'
            } else {
              const gateIcon = gate === 'OK' ? '✅' : gate === 'ERROR' ? '❌' : '⚠️'
              body += `**Quality Gate:** ${gateIcon} ${gate}\n\n`

              if (hasIssues) {
                body += '### Files with Duplications\n\n'
                body += '| File | New Dup Lines | Density |\n|---|---|---|\n'
                const rows = process.env.ROWS.split(';;').filter(Boolean)
                for (const row of rows) {
                  const [file, newDup, density] = row.split('|')
                  body += `| \`${file}\` | ${newDup} | ${density} |\n`
                }
                body += '\n> Fix: Extract repeated patterns into helpers, or add to `sonar.exclusions` in `sonar-project.properties`.\n'
              } else {
                body += '✅ No CPD issues detected on new code.\n'
              }
            }

            body += `\n---\n_[SonarCloud Dashboard](https://sonarcloud.io/project/overview?id=xzawed_xzawed-pais) · Analysis: ${sonarStatus}_`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  # ── SonarCloud Analysis ───────────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [turborepo, independent, shared-lib]
    if: always()
    # fork·Dependabot PR 은 SONAR_TOKEN 에 접근할 수 없다. 그동안은 잡이 '실패'해서
    # 코드 문제와 구분되지 않았다 — 토큰 부재는 건너뛰되 경고로 가시화한다.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # upload-artifact@v4 strips common path prefix from single-file artifacts,
      # so each artifact must be downloaded to its correct target directory.
      - name: Download coverage - xzawedOrchestrator
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedOrchestrator
          path: xzawedOrchestrator/packages

      - name: Download coverage - xzawedManager
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedManager
          path: xzawedManager/packages

      - name: Download coverage - xzawedPlanner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedPlanner
          path: xzawedPlanner/coverage

      - name: Download coverage - xzawedDeveloper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedDeveloper
          path: xzawedDeveloper/coverage

      - name: Download coverage - xzawedDesigner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedDesigner
          path: xzawedDesigner/coverage

      - name: Download coverage - xzawedTester
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedTester
          path: xzawedTester/coverage

      - name: Download coverage - xzawedBuilder
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedBuilder
          path: xzawedBuilder/coverage

      - name: Download coverage - xzawedWatcher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedWatcher
          path: xzawedWatcher/coverage

      - name: Download coverage - xzawedSecurity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedSecurity
          path: xzawedSecurity/coverage

      - name: Download coverage - xzawedShared
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xzawedShared
          path: xzawedShared/coverage

      - name: Prefix lcov paths with package directories
        run: |
          python3 - << 'PYEOF'
          import os, re

          prefixes = {
              'xzawedOrchestrator/packages/server/coverage/lcov.info': 'xzawedOrchestrator/packages/server/',
              'xzawedOrchestrator/packages/app/coverage/lcov.info': 'xzawedOrchestrator/packages/app/',
              'xzawedOrchestrator/packages/ui/coverage/lcov.info': 'xzawedOrchestrator/packages/ui/',
              'xzawedManager/packages/server/coverage/lcov.info': 'xzawedManager/packages/server/',
              'xzawedPlanner/coverage/lcov.info': 'xzawedPlanner/',
              'xzawedDeveloper/coverage/lcov.info': 'xzawedDeveloper/',
              'xzawedDesigner/coverage/lcov.info': 'xzawedDesigner/',
              'xzawedTester/coverage/lcov.info': 'xzawedTester/',
              'xzawedBuilder/coverage/lcov.info': 'xzawedBuilder/',
              'xzawedWatcher/coverage/lcov.info': 'xzawedWatcher/',
              'xzawedSecurity/coverage/lcov.info': 'xzawedSecurity/',
              'xzawedShared/coverage/lcov.info': 'xzawedShared/',
          }

          for lcov_path, prefix in prefixes.items():
              if not os.path.exists(lcov_path):
                  continue
              with open(lcov_path, encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'^SF:', f'SF:{prefix}', content, flags=re.MULTILINE)
              with open(lcov_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Prefixed {lcov_path} with {prefix}')
          PYEOF

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SONAR_TOKEN 부재 — 분석 건너뜀
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=SonarCloud 미실행::SONAR_TOKEN 이 없어 정적 분석을 건너뜁니다(fork·bot PR 구조적 제약). 코드 문제가 아닙니다."

  # ── i18n Key Sync Check ───────────────────────────────────────────────────
  i18n-check:
    name: i18n Key Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check i18n key parity (ko/en/ja)
        run: node scripts/check-i18n.js

  # ── 문서 불변식(링크 실존 · CLAUDE.md 200줄) ───────────────────────
  docs-check:
    name: Docs Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check docs invariants
        run: node scripts/check-docs.js

  # ── Module Boundaries (M3: 서비스 간 직접 import 금지) ─────────────────────
  module-boundaries:
    name: Module Boundaries (M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependency-cruiser
        run: npm install --ignore-scripts --no-fund --no-audit dependency-cruiser@16.10.4 typescript@5.7.3

      - name: Check service import boundaries (no cross-service imports)
        run: ./node_modules/.bin/depcruise --config .dependency-cruiser.cjs --no-progress --output-type err "xzawed*/src/**/*.{ts,tsx}" "xzawed*/packages/*/src/**/*.{ts,tsx}"

  # ── Summary gate (required for branch protection) ─────────────────────────
  all-checks-pass:
    name: All checks pass
    runs-on: ubuntu-latest
    needs: [turborepo, independent, redis-integration, manager-redis-integration, playwright-e2e, launcher, shared-lib, i18n-check, docs-check, module-boundaries, sonar]
    if: always()
    steps:
      - name: Check results
        run: |
          fail=0
          # skip-ok: PR 에서만 도는 잡(push 에서는 skipped 가 정상).
          check() {
            local name="$1" result="$2" allow_skip="${3:-}"
            if [[ "$result" == "success" ]]; then
              echo "✓ $name"
              return
            fi
            if [[ "$allow_skip" == "skip-ok" && "$result" == "skipped" ]]; then
              echo "· $name: skipped (이 이벤트에서는 정상)"
              return
            fi
            echo "✗ $name: $result"
            fail=1
          }
          check turborepo                 "${{ needs.turborepo.result }}"
          check independent               "${{ needs.independent.result }}"
          check redis-integration         "${{ needs.redis-integration.result }}"
          check manager-redis-integration "${{ needs.manager-redis-integration.result }}"
          check playwright-e2e            "${{ needs.playwright-e2e.result }}"
          check launcher                  "${{ needs.launcher.result }}"
          check shared-lib                "${{ needs.shared-lib.result }}"
          check i18n-check                "${{ needs.i18n-check.result }}"
          check docs-check                "${{ needs.docs-check.result }}"
          check module-boundaries         "${{ needs.module-boundaries.result }}"
          # cpd 는 아직 필수가 아니다 — 실패 삼킴을 걷어내니 기존 클론 6건이 드러났고,
          # 그중 5건은 교차 서비스라 저장소의 module-boundaries 규칙이 금지하는 공유를
          # 해야만 사라진다(Manager↔Orchestrator 는 공유 라이브러리가 아예 없다).
          # 그 아키텍처 결정 전에 필수로 올리면 무관한 작업이 전부 막힌다.
          # 지금은 '보이지만 막지 않는' 상태이고, 승격은 클론 정리 슬라이스에서 한다.
          check sonar                     "${{ needs.sonar.result }}" skip-ok
          if [[ $fail -ne 0 ]]; then
            echo "필수 잡 중 실패가 있습니다"
            exit 1
          fi
          echo "필수 잡 전부 통과"
