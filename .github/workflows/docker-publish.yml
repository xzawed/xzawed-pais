name: Docker Publish

on:
  # 결손 이미지 재발행 수단. 게이트 트리거만 있으면 크래시로 빠진 태그를 되돌릴 방법이 없다.
  workflow_dispatch:
  # **CI 가 끝난 뒤에 돈다.** 이전에는 `push: branches: [master]` 라 CI 와 **동시에** 출발했다.
  # 실측: master `76ec026` 의 publish 는 16:22:01Z 에 끝났고 그 커밋의 CI 는 16:24:31Z 에
  # 끝났다 — **판정이 나오기 2분 30초 전에 `:latest` 가 이미 GHCR 에 있었다.**
  #
  # `paths` 필터는 함께 없앴다. `workflow_run` 이 경로 필터를 지원하지 않기도 하지만,
  # 그 필터가 `package.json`·`pnpm-lock.yaml` 을 빼먹고 있어서 **의존성만 바뀐 머지는
  # 발행되지 않고 `:latest` 가 조용히 낡았다**(실측: `f034d6a` 는 그 두 파일만 바꿨고
  # docker-publish 런이 0건이다). 전부 발행하는 편이 정직하다 — 실측 비용은 런 두 건이
  # 각각 `40d20e2` 3분 34초(큐 없음), `75e832a` 11분 22초(큐 8분 07초 + 빌드 3분 15초)로,
  # 9개 매트릭스 전체 빌드 자체는 3분대다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# 발행을 직렬화한다. **다만 GitHub 의 큐는 "줄"이 아니다** — 실행 1 + 대기 1 이고, 세 번째가
# 오면 **대기 중이던 것이 취소된다**. 그래서 이것만으로는 순서가 보장되지 않는다(아래 신선도
# 가드가 그 몫이다). `cancel-in-progress: false` 인 이유는 진행 중인 발행을 중간에 끊으면
# 9개 중 일부만 갱신된 `:latest` 가 남기 때문이다.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # **`event == 'push'` 가 보안 가드다 — 빼면 안 된다.**
    # `workflow_run` 은 **특권 토큰**(`packages: write` · 시크릿 접근)으로 돌고, 위의
    # `branches: [master]` 는 트리거한 런의 `head_branch` 를 본다. `pull_request` 로 돈 CI 런의
    # `head_branch` 는 **PR 소스 브랜치 이름**이라, fork 의 기본 브랜치명이 `master` 인 PR 이
    # 그 필터를 통과한다. 그러면 신뢰할 수 없는 `head_sha` 를 체크아웃해 특권 토큰으로
    # `:latest` 를 GHCR 에 민다(저장소가 공개라 누구나 열 수 있다). `event == 'push'` 로
    # **master 에 실제로 push 된 커밋의 CI 런만** 받는다.
    #
    # 수동 재발행이 필요하면 이 워크플로 자신의 `workflow_dispatch` 를 쓴다 — 그쪽은
    # 저장소 쓰기 권한이 있어야 부를 수 있다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # 한 서비스의 QEMU arm64 크래시가 나머지 8개를 함께 끌어내리지 않게 한다.
      # 실측: 2026-08-22·08-23 런에서 fail-fast 로 8개가 cancelled 됐다. 이미지 발행은
      # 서비스별로 독립이므로 하나가 죽어도 나머지는 나가는 편이 낫다.
      fail-fast: false
      matrix:
        service:
          - { name: orchestrator, dir: xzawedOrchestrator }
          - { name: manager,      dir: xzawedManager }
          - { name: planner,      dir: xzawedPlanner }
          - { name: developer,    dir: xzawedDeveloper }
          - { name: designer,     dir: xzawedDesigner }
          - { name: tester,       dir: xzawedTester }
          - { name: builder,      dir: xzawedBuilder }
          - { name: watcher,      dir: xzawedWatcher }
          - { name: security,     dir: xzawedSecurity }

    steps:
      # **CI 가 검증한 그 커밋을 굽는다.** `workflow_run` 에서 `github.sha` 는 트리거 시점의
      # 기본 브랜치 tip 이라, 그 사이 머지가 하나 더 들어오면 **검증되지 않은 커밋**이 구워진다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # **`:latest` 를 옛 커밋으로 되돌리지 않는다.**
      # 발행 도착 순서는 머지 순서가 아니라 **CI 완료 순서**다(CI 소요가 커밋마다 다르다).
      # 그래서 늦게 머지된 커밋의 발행이 먼저 끝나고, 먼저 머지된 커밋의 발행이 나중에 끝나
      # `:latest` 를 뒤로 되돌릴 수 있다. concurrency 로는 막히지 않는다 — 그것은 동시 실행만
      # 줄이고 순서는 정하지 않는다.
      #
      # 그래서 굽기 전에 이 커밋이 아직 master 의 tip 인지 본다. 아니면 `:latest` 를 붙이지
      # 않고 sha 태그만 민다 — 그 커밋의 이미지는 남되 `:latest` 는 더 새 커밋의 발행이 정한다.
      # (그 발행은 이미 돌고 있거나 곧 돈다. 이 워크플로는 성공한 master CI 마다 돈다.)
      - name: 태그 결정 — 이 커밋이 아직 master tip 인가
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE: ghcr.io/xzawed/xzawed-${{ matrix.service.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIP=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
          echo "head=$HEAD_SHA tip=$TIP"
          {
            echo "list<<TAGS_EOF"
            if [ "$HEAD_SHA" = "$TIP" ]; then
              echo "$IMAGE:latest"
            else
              echo "::notice title=latest 건너뜀::$HEAD_SHA 는 더 이상 master tip 이 아니다(현재 $TIP). sha 태그만 발행한다." >&2
            fi
            echo "$IMAGE:$HEAD_SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dir }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 위 스텝이 정한다 — tip 이 아니면 `:latest` 가 빠지고 sha 태그만 남는다.
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=docker-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.service.name }}
