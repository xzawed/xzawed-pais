# open-pull-requests-limit 을 명시하는 이유: 기본값은 생태계당 5 다. 여기에는 npm 13개
# 디렉토리 + github-actions 1개, 총 14개 항목이 있어 기본값이면 주간 실행 하나가 최대
# 70건을 연다. 게다가 bot PR 은 SONAR_TOKEN 에 접근할 수 없어 SonarCloud 가 구조적으로
# 실패하므로(루트 CLAUDE.md 참조) 열린 만큼 그대로 적색으로 쌓인다 — 실제로 15건이
# 쌓여 #513 에서 일괄 정산해야 했다. 로컬 일괄 반영 + 사람 브랜치 단일 PR 이 정착한
# 처리 방식이므로, 알림용으로 소수만 열리게 둔다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /xzawedOrchestrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, xzawedOrchestrator]

  - package-ecosystem: npm
    directory: /xzawedManager
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, xzawedManager]

